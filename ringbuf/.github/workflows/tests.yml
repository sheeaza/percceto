name: tests

# Runs the full CTest suite on every push and PR. The sanitizer build is
# opt-in locally (-DRINGBUF_BUILD_TSAN=ON) but always ON here: tsan is the
# gate on the lock-free ordering in ringbuf.c and on the mutex variant's
# unlocked push path, so CI is exactly where it should not be skippable.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run for the same ref rather than queueing both.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Four jobs: {x86-64, arm64} x {gcc, clang}.
    #
    # The arm64 half is the point of this matrix, not a portability
    # courtesy. x86-64 is TSO: acquire/release compiles to plain movs
    # there, so a store that should carry release but was left relaxed
    # usually still behaves. aarch64 compiles the same orderings to real
    # instructions -- ldar/stlr -- and reorders without them. Every variant
    # here rests on one acquire/release pair that CLAUDE.md calls the only
    # ordering doing real work, so arm64 is where getting it wrong becomes
    # observable rather than merely incorrect.
    #
    # Concretely, cross-compiled for aarch64 at -O2: ringbuf.o emits
    # 7 ldar / 5 stlr and ringbuf_vslot.o emits 7 ldar / 9 stlr. None of
    # those instructions exist in the x86-64 objects.
    #
    # Linux only on both, and not just a default: ringbuf_vslot needs
    # memfd_create, and both benchmarks need pthread_setaffinity_np. On
    # another OS the CMake gate would quietly drop two of the six CTest
    # entries and the job would still go green.
    #
    # ubuntu-24.04-arm is a native arm64 runner (free for public repos), so
    # this is real weak-memory hardware rather than qemu -- emulation would
    # not reproduce the reorderings this is here to catch, since qemu-user
    # does not faithfully model the relaxed memory model.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, runner: ubuntu-latest, compiler: gcc }
          - { arch: x86-64, runner: ubuntu-latest, compiler: clang }
          - { arch: arm64, runner: ubuntu-24.04-arm, compiler: gcc }
          - { arch: arm64, runner: ubuntu-24.04-arm, compiler: clang }

    name: test (${{ matrix.arch }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.runner }}

    env:
      CC: ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v4

      - name: Report compiler and architecture
        # Both runner images ship gcc, clang and cmake (checked against
        # actions/runner-images), so nothing is installed here. Printing the
        # versions keeps a record in the log of what actually built it, and
        # turns a future image change into an obvious diff rather than a
        # mystery failure.
        run: |
          ${{ matrix.compiler }} --version
          cmake --version | head -1
          uname -m
          nproc

      - name: Configure
        # Warnings are errors here but not in the normal build: a local
        # -Werror turns an unrelated toolchain quirk into a hard stop
        # mid-task, whereas CI wants the opposite bias.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DRINGBUF_BUILD_TSAN=ON
          -DCMAKE_C_FLAGS=-Werror

      - name: Build
        run: cmake --build build -j

      - name: Test
        # The whole suite is ~15 s on x86-64; the arm64 runners are smaller,
        # so the timeout is generous rather than tight. It is a backstop
        # against a regression that wedges the buffer: the tests' own
        # MAX_SPIN bounds a stalled push/pop, but a corrupted-yet-
        # progressing stream resets that counter on every success and would
        # otherwise hang the runner for the full six hours.
        #
        # The arm64 tsan entries are expected to run: these runners are
        # 48-bit-VA Azure hosts. Should a future image move to a 39-bit VA
        # kernel, tsan aborts with "unsupported VMA range" -- that is a
        # known ThreadSanitizer/aarch64 limitation, not a bug in this tree,
        # and the three non-tsan entries still gate the logic there.
        run: ctest --test-dir build --output-on-failure --timeout 300

  format:
    # Architecture-independent, so this runs once rather than per-arch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        # clang-format ships on the runner image. --dry-run --Werror reports
        # a diff as a failure without touching the tree. The .clang-format in
        # the repo is the single source of truth, so this needs no flags.
        run: clang-format --dry-run --Werror *.c *.h

      - name: Check for struct typedefs
        # A style rule clang-format cannot express (see CLAUDE.md): structs
        # are never typedef'd, and the only _t names should come from the
        # standard library. Matches `typedef struct ... ;` on one line and
        # the closing `} name_t;` of a multi-line form.
        run: |
          if grep -nE '^\s*typedef\s+struct|^\}\s*[A-Za-z_][A-Za-z0-9_]*_t\s*;' *.c *.h; then
            echo "::error::struct typedefs are not used in this tree (see CLAUDE.md)"
            exit 1
          fi
